<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <!-- Jangan pernah nonaktifkan zoom (aksesibilitas) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ruang Matriks — media belajar matriks interaktif untuk Matematika Tingkat Lanjut - Kelas 11. Dimainkan dalam mode lanskap.">
  <meta name="theme-color" content="#EFF4FF">
  <title>Ruang Matriks — Matematika Tingkat Lanjut - Kelas 11</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;700&display=swap">

  <!-- KaTeX -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
        crossorigin="anonymous">

  <!-- Gaya aplikasi (urutan penting: token → layout → komponen → matriks → scrollbar → animasi)

       ?v=… adalah PENANDA VERSI (cache-busting). Peramban & hosting menahan
       salinan lama berkas CSS; tanpa penanda ini siswa bisa mendapat HTML
       baru dengan gaya lama — tata letak setengah jadi. NAIKKAN angkanya di
       SEMUA baris (dan di app.js di bawah) setiap kali CSS/JS berubah. -->
  <link rel="stylesheet" href="css/base.css?v=20.0">
  <link rel="stylesheet" href="css/layout.css?v=20.0">
  <link rel="stylesheet" href="css/components.css?v=20.0">
  <link rel="stylesheet" href="css/matrix.css?v=20.0">
  <link rel="stylesheet" href="css/simulations.css?v=20.0">
  <link rel="stylesheet" href="css/scrollbars.css?v=20.0">
  <link rel="stylesheet" href="css/animations.css?v=20.0">
  <link rel="stylesheet" href="css/phase7.css?v=20.0">
  <link rel="stylesheet" href="css/phase8.css?v=20.0">
  <link rel="stylesheet" href="css/phase9.css?v=20.0">
  <link rel="stylesheet" href="css/phase10.css?v=20.0">
  <link rel="stylesheet" href="css/phase11.css?v=20.0">
  <link rel="stylesheet" href="css/phase12.css?v=20.0">
  <link rel="stylesheet" href="css/phase13.css?v=20.0">
  <link rel="stylesheet" href="css/phase14.css?v=20.0">
  <link rel="stylesheet" href="css/phase15.css?v=20.0">
  <link rel="stylesheet" href="css/phase16.css?v=20.0">
  <link rel="stylesheet" href="css/phase17.css?v=20.0">
  <link rel="stylesheet" href="css/phase18.css?v=20.0">

  <!-- Mode Malam (Fase 20) diterapkan SEBELUM halaman tergambar. Kalau
       menunggu app.js (modul, ditunda), siswa yang memilih mode malam akan
       melihat kilatan putih selebar layar di setiap muat — tepat yang ingin
       dihindari mode ini. Bawaan tetap TERANG; mode malam hanya pilihan. -->
  <script>
    try {
      if (localStorage.getItem('matriksLab.appearance.v1') === 'night') {
        document.documentElement.dataset.mode = 'night';
      }
    } catch (e) { /* penyimpanan diblokir: tetap terang */ }
  </script>

  <!-- Favicon: kotak biru TERANG dengan glif navy gelap — terbaca di tab
       terang maupun gelap (versi lama gelap-di-atas-gelap tidak terlihat). -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234D8DFF'/><g fill='%2306172E'><rect x='24' y='26' width='20' height='20' rx='5'/><rect x='56' y='26' width='20' height='20' rx='5'/><rect x='24' y='54' width='20' height='20' rx='5'/><rect x='56' y='54' width='20' height='20' rx='5'/></g></svg>">
</head>
<body>

  <!-- Latar: tiga bidang warna lembut yang mengambang pelan, ditumpuk
       pola titik halus. Dekoratif murni, jadi disembunyikan dari
       pembaca layar dan tidak pernah menangkap pointer. -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <!-- Pengunci orientasi. CSS yang menyalakannya di mode potret; markup-nya
       selalu ada agar pembaca layar tetap menemukan pesannya. -->
  <div class="rotate-lock" role="alertdialog" aria-live="polite"
       aria-labelledby="rotate-title" aria-describedby="rotate-text">
    <div class="rotate-lock__panel">
      <span class="rotate-lock__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2" width="12" height="20" rx="2.5"/>
          <path d="M11 18.5h2"/>
          <path d="M2.5 12a9.5 9.5 0 0 1 4-7.7"/>
          <path d="M2.5 8.4V12h3.6"/>
        </svg>
      </span>
      <h2 class="rotate-lock__title" id="rotate-title">Putar Perangkatmu</h2>
      <p class="rotate-lock__text" id="rotate-text">
        Mohon putar perangkat Anda ke mode Landscape untuk pengalaman belajar terbaik.
      </p>
      <span class="rotate-lock__hint">Ruang Matriks</span>
    </div>
  </div>

  <!-- ============================================================
       LAYAR MUAT

       Markupnya STATIS di HTML, bukan dibuat JavaScript: di jaringan
       sekolah yang lambat, modul ES bisa perlu beberapa detik untuk
       tiba, dan sepanjang itu layar tidak boleh kosong-putih.

       Bentuknya matriks 2x2 di dalam kurung siku — bukan spinner
       generik. Bentuk itu sudah jadi tanda pengenal aplikasi ini:
       ia sama dengan favicon dan dengan logo di header, sehingga
       yang dilihat siswa selama menunggu adalah MEREKNYA, bukan
       sebuah roda berputar yang bisa milik aplikasi mana pun.
       ============================================================ -->
  <div class="boot" id="boot-loader" role="status" aria-live="polite">
    <div class="boot__stage" aria-hidden="true">
      <span class="boot__bracket boot__bracket--left"></span>
      <div class="boot__grid">
        <span class="boot__cell"></span>
        <span class="boot__cell"></span>
        <span class="boot__cell"></span>
        <span class="boot__cell"></span>
      </div>
      <span class="boot__bracket boot__bracket--right"></span>
    </div>
    <p class="boot__text">Memuat Ruang Matriks…</p>
  </div>

  <div id="app">

    <!-- Header tetap: identitas & progres -->
    <header class="app-header">
      <div class="brand">
        <button class="brand__mark" type="button" data-role="home" aria-label="Kembali ke menu utama">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </button>
        <div class="brand__text">
          <div class="brand__title">Ruang Matriks</div>
          <div class="brand__sub">Matematika Tingkat Lanjut - Kelas 11</div>
        </div>
      </div>

      <!-- Progres duduk di TENGAH atas: ia milik seluruh aplikasi, bukan
           milik salah satu sisi. Tombol layar penuh mengambang di kanan atas
           (di luar #app), jadi kolom kanan header sengaja disisakan kosong
           selebar tombol itu agar keduanya tidak pernah bertabrakan. -->
      <div class="header-center">
        <!-- Fase 20: cincin menjadi "pil" — lingkaran kecil + angka di
             SAMPINGNYA. Angka "100%" di dalam lingkaran 40px berdesakan;
             di luar lingkaran ia punya ruang untuk dibaca. Kelas-kelas lama
             (.progress-ring, __bar, __label) dipertahankan: §72 smoke.py
             mengukur bahwa .progress-ring tepat di tengah header. -->
        <div class="progress-ring" role="img" aria-label="Persentase penguasaan kurikulum">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <defs>
              <linearGradient id="ring-gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFD84F"/>
                <stop offset="1" stop-color="#E0A100"/>
              </linearGradient>
            </defs>
            <circle class="progress-ring__track" cx="20" cy="20" r="16" fill="none" stroke-width="4"/>
            <circle class="progress-ring__bar" cx="20" cy="20" r="16" fill="none" stroke-width="4"
                    stroke-dasharray="100.5" stroke-dashoffset="100.5"/>
          </svg>
          <span class="progress-ring__text">
            <span class="progress-ring__label">0%</span>
            <span class="progress-ring__caption">kurikulum</span>
          </span>
        </div>
      </div>

      <div class="header-slot" aria-hidden="true"></div>

      <!-- Pengalih Mode Malam (Fase 20). Berbagi kolom kanan dengan ruang
           yang dipesan untuk tombol layar penuh, tetapi duduk DI KIRI ruang
           itu — keduanya tidak pernah bertabrakan (kontrak §72). Sengaja
           BUKAN data-role="theme": pengalih tema gelap lama Fase 9 tetap
           dicabut; ini pilihan kenyamanan baca yang terpisah. -->
      <button class="mode-toggle" type="button" data-role="appearance"
              aria-pressed="false" aria-label="Aktifkan mode malam" title="Mode malam">
        <svg class="mode-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="mode-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/>
        </svg>
      </button>
    </header>

    <!-- Satu layar terlihat pada satu waktu; tidak ada scroll di level body -->
    <main class="screen-host" id="screen-host"></main>

    <footer class="app-footer">
      <span class="app-footer__text">
        © Penta Putra Purnomo, S.Pd., Gr. | SMAS YPVDP Bontang.
      </span>
    </footer>

  </div>

  <!-- Layar penuh: aksi global, jadi ia hidup di luar #app supaya tidak
       ikut dibongkar setiap kali layar berganti. -->
  <button class="fs-btn" type="button" data-role="fullscreen" aria-label="Masuk mode layar penuh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
    </svg>
    <span>Layar Penuh</span>
  </button>

  <!-- Pesan bila JavaScript dimatikan -->
  <noscript>
    <div style="padding:24px;text-align:center;font-family:system-ui">
      <h2>JavaScript diperlukan</h2>
      <p>Aplikasi ini sepenuhnya berjalan di browser dan membutuhkan JavaScript aktif.</p>
    </div>
  </noscript>

  <!-- Pustaka pihak ketiga: defer agar tidak memblokir render -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
          integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
          crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>

  <script>
    // Daftarkan MotionPathPlugin begitu GSAP siap (lintasan lengkung ala Manim).
    window.addEventListener('load', function () {
      if (window.gsap && window.MotionPathPlugin) {
        window.gsap.registerPlugin(window.MotionPathPlugin);
      }
    });
  </script>

  <!-- Modul aplikasi (ES6 native, tanpa build step) -->
  <script type="module" src="js/app.js?v=20.0"></script>

</body>
</html>
